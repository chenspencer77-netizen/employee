server:
  port: 8082

# Dubbo configuration
dubbo:
  protocol:
    name: dubbo
    port: 20881
  registry:
    address: nacos://nacos:8848
  application:
    qos-enable: false
  consumer:
    check: false

# Database configuration
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/flex_work_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    sentinel:
      transport:
        dashboard: sentinel:8858

# MyBatis configuration
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.flexwork.user: DEBUG
